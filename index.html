<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Parelheiros - Comércio e Serviços do Bairro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div>
                <h1>Guia Parelheiros</h1>
                <p>Tudo o que você precisa perto de você</p>
            </div>
            <a href="painel.html" class="btn-anunciante" style="text-decoration:none;">
                Área do Anunciante
            </a>
        </div>
    </header>

    <section class="container banner-section">
        <div class="banner-box">
            <a id="banner-link" href="#newsletter-area">
                <img id="banner-img" src="https://placehold.co" alt="Banner Comercial">
            </a>
            <div class="badge-patrocinado">Patrocinado</div>
        </div>
    </section>

    <section class="container">
        <div class="busca-box">
            <input type="text" id="campo-busca" onkeyup="filtrarAnuncios()" placeholder="O que você procura em Parelheiros? (Ex: pizzaria, farmácia, oficina...)">
            <button onclick="filtrarAnuncios()" class="btn-buscar">Buscar</button>
        </div>
    </section>

    <main class="container">
        <h2 class="secao-titulo">Destaques do Bairro</h2>
        <div id="lista-comercios" class="grid-comercios">
            <p style="color:#6b7280;">Carregando comércios de Parelheiros...</p>
        </div>
    </main>

    <section id="newsletter-area" class="container">
        <div class="newsletter-box">
            <h2>Receba promoções e novidades do bairro</h2>
            <p>Cadastre seu e-mail para receber cupons de desconto dos comerciantes locais toda semana.</p>
            <form id="form-newsletter" onsubmit="salvarNewsletter(event)" class="form-news">
                <input type="text" id="news-nome" required placeholder="Seu nome">
                <input type="email" id="news-email" required placeholder="Seu melhor e-mail">
                <button type="submit" id="btn-news-submit" class="btn-news">Cadastrar</button>
            </form>
            <p id="msg-newsletter" style="display:none; margin-top:12px; font-weight:bold;"></p>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://swqaqpiocsxdgfhtsihv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cWFxcGlvY3N4ZGdmaHRzaWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NzIyNzcsImV4cCI6MjExMDI0ODI3N30.SaC_kekEhFusvRkrimsV5LqApdtdKsI2N0gZihjLQNY';
        const HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };

        let todosAnuncios = [];
        let bannersTopo = [];
        let indexBanner = 0;

        async function carregarPortal() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/anuncios?aprovado=eq.true&order=criado_em.desc`, { headers: HEADERS });
                const data = await res.json();
                todosAnuncios = Array.isArray(data) ? data : [];
                bannersTopo = todosAnuncios.filter(item => item.destaque_topo);
                iniciarRotacaoBanners();
                renderizarCards(todosAnuncios);
            } catch (err) {
                document.getElementById('lista-comercios').innerHTML = '<p style="color:#6b7280;">Nenhum comércio cadastrado ainda.</p>';
            }
        }

        function iniciarRotacaoBanners() {
            if (bannersTopo.length === 0) return;
            const atualizarBanner = () => {
                const atual = bannersTopo[indexBanner];
                document.getElementById('banner-img').src = atual.imagem_url;
                if (atual.whatsapp) {
                    const numLimpo = atual.whatsapp.replace(/\D/g, '');
                    document.getElementById('banner-link').href = `https://wa.me{numLimpo}`;
                    document.getElementById('banner-link').target = '_blank';
                }
                indexBanner = (indexBanner + 1) % bannersTopo.length;
            };
            atualizarBanner();
            if (bannersTopo.length > 1) setInterval(atualizarBanner, 4500);
        }

        function renderizarCards(lista) {
            const container = document.getElementById('lista-comercios');
            if (lista.length === 0) {
                container.innerHTML = '<p style="color:#6b7280;">Nenhum comércio encontrado ainda. Seja o primeiro a anunciar!</p>';
                return;
            }
            container.innerHTML = lista.map(item => {
                const numLimpo = (item.whatsapp || '').replace(/\D/g, '');
                const botaoWhats = numLimpo ? `<a href="https://wa.me{numLimpo}" target="_blank" class="btn-whats">Chamar no WhatsApp</a>` : '';
                return `
                    <div class="card-comercio">
                        <img src="${item.imagem_url}" alt="${item.titulo}">
                        <div class="card-body">
                            <span class="categoria">${item.categoria}</span>
                            <h3>${item.titulo}</h3>
                            <p>${item.descricao || ''}</p>
                            ${botaoWhats}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filtrarAnuncios() {
            const termo = document.getElementById('campo-busca').value.toLowerCase();
            const filtrados = todosAnuncios.filter(item =>
                item.titulo.toLowerCase().includes(termo) ||
                item.categoria.toLowerCase().includes(termo) ||
                (item.descricao && item.descricao.toLowerCase().includes(termo))
            );
            renderizarCards(filtrados);
        }

        async function salvarNewsletter(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-news-submit');
            const msg = document.getElementById('msg-newsletter');
            const nome = document.getElementById('news-nome').value;
            const email = document.getElementById('news-email').value;

            btn.disabled = true;
            btn.textContent = 'Salvando...';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/newsletter`, {
                    method: 'POST',
                    headers: { ...HEADERS, 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ nome, email })
                });

                msg.style.display = 'block';
                if (res.ok) {
                    msg.textContent = 'Cadastro realizado com sucesso! Você receberá nossas ofertas.';
                    msg.style.color = '#ffffff';
                    e.target.reset();
                } else {
                    const erro = await res.json();
                    msg.textContent = erro.code === '23505' ? 'Este e-mail já está cadastrado!' : 'Erro ao salvar: ' + (erro.message || 'verifique o banco.');
                    msg.style.color = '#fde047';
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.textContent = 'Falha de conexão. Tente novamente.';
                msg.style.color = '#fde047';
            }

            btn.disabled = false;
            btn.textContent = 'Cadastrar';
        }

        carregarPortal();
    </script>
</body>
</html>
