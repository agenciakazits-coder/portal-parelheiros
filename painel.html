<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Anunciante - Guia Parelheiros</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .painel-box { background: white; border-radius: 12px; padding: 24px; margin-top: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .tab-btn { background: #f3f4f6; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .tab-btn.ativa { background: #047857; color: white; }
        .select-input, .textarea-input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
        .badge-status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .status-aprovado { background: #d1fae5; color: #065f46; }
        .status-pendente { background: #fef3c7; color: #92400e; }
        .btn-acao { border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-right: 6px; margin-top: 8px; }
        .btn-aprovar { background: #059669; color: white; }
        .btn-topo { background: #2563eb; color: white; }
        .btn-excluir { background: #dc2626; color: white; }
        .tabela-news { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
        .tabela-news th, .tabela-news td { border-bottom: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div>
                <h1>Painel Guia Parelheiros</h1>
                <p id="usuario-logado-texto">Acesso restrito a anunciantes e administração</p>
            </div>
            <div style="display:flex; gap:8px;">
                <a href="index.html" class="btn-anunciante" style="text-decoration:none;">Ver Site</a>
                <button id="btn-sair" onclick="sair()" class="btn-anunciante" style="display:none; background:#fee2e2; color:#991b1b;">Sair</button>
            </div>
        </div>
    </header>

    <main class="container" style="margin-bottom: 50px;">
        <div id="tela-auth" class="painel-box" style="max-width: 440px; margin: 40px auto;">
            <div class="tabs">
                <button type="button" id="tab-login" class="tab-btn ativa" onclick="mudarAbaAuth('login')">Entrar</button>
                <button type="button" id="tab-cadastro" class="tab-btn" onclick="mudarAbaAuth('cadastro')">Criar Conta de Comerciante</button>
            </div>
            <form id="form-auth" onsubmit="processarAuth(event)">
                <div id="campo-empresa" class="campo-form" style="display:none;">
                    <label>Nome do Comércio ou Empresa</label>
                    <input type="text" id="auth-empresa" placeholder="Ex: Pizzaria do Bairro">
                </div>
                <div class="campo-form">
                    <label>E-mail</label>
                    <input type="email" id="auth-email" required placeholder="seu@email.com">
                </div>
                <div class="campo-form">
                    <label>Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="auth-senha" required minlength="6" placeholder="******">
                </div>
                <button type="submit" id="btn-auth-submit" class="btn-entrar">Entrar no Painel</button>
            </form>
            <p id="msg-auth" style="margin-top:12px; font-size:0.85rem; color:#dc2626; font-weight:600;"></p>
        </div>

        <div id="tela-sistema" style="display:none;">
            <div class="painel-box">
                <h2 style="font-size:1.2rem; margin-bottom:4px;">Cadastrar Novo Anúncio ou Banner</h2>
                <p style="font-size:0.85rem; color:#6b7280; margin-bottom:16px;">Envie a imagem do seu comércio.</p>
                <form id="form-anuncio" onsubmit="criarAnuncio(event)">
                    <div class="campo-form">
                        <label>Nome do Comércio / Título do Anúncio</label>
                        <input type="text" id="anuncio-titulo" required placeholder="Ex: Mercado Central Parelheiros">
                    </div>
                    <div class="campo-form">
                        <label>Categoria</label>
                        <select id="anuncio-categoria" class="select-input">
                            <option value="Alimentação">Alimentação (Padaria, Pizzaria, Lanchonete)</option>
                            <option value="Mercados e Comércio">Mercados e Comércio</option>
                            <option value="Saúde e Beleza">Saúde, Farmácia e Beleza</option>
                            <option value="Auto e Serviços">Oficinas, Auto Elétrica e Serviços</option>
                            <option value="Construção e Casa">Material de Construção e Casa</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="campo-form">
                        <label>WhatsApp com DDD (apenas números)</label>
                        <input type="text" id="anuncio-whats" required placeholder="Ex: 11999999999">
                    </div>
                    <div class="campo-form">
                        <label>Descrição curta da oferta</label>
                        <textarea id="anuncio-desc" rows="2" class="textarea-input" placeholder="Ex: Entregamos em toda região de Parelheiros."></textarea>
                    </div>
                    <div class="campo-form">
                        <label>Imagem do Banner (Foto do celular ou PC)</label>
                        <input type="file" id="anuncio-arquivo" accept="image/*" required style="border:none; padding:6px 0;">
                    </div>
                    <button type="submit" id="btn-salvar-anuncio" class="btn-entrar">Enviar Anúncio</button>
                </form>
            </div>

            <div class="painel-box">
                <h2 id="titulo-lista-anuncios" style="font-size:1.2rem; margin-bottom:16px;">Meus Anúncios</h2>
                <div id="lista-painel-anuncios" class="grid-comercios"></div>
            </div>

            <div id="box-admin-newsletter" class="painel-box" style="display:none;">
                <h2 style="font-size:1.2rem; margin-bottom:12px;">Contatos da Newsletter (Admin)</h2>
                <div style="overflow-x:auto;">
                    <table class="tabela-news">
                        <thead><tr><th>Nome</th><th>E-mail</th><th>Data</th></tr></thead>
                        <tbody id="corpo-tabela-news"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="painel.js"></script>
</body>
</html>
